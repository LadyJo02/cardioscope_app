name: cardioscope_app
description: "A mobile auscultation tool for clinicians with on-device AI analysis, patient management, and reporting."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter 

  # Core Functionality
  shared_preferences: ^2.2.3         # Store small key-value data persistently
  sqflite: ^2.3.3                    # SQLite database support for structured data
  path_provider: ^2.1.3              # Access platform-specific directories (e.g., app data)
  intl: ^0.19.0                      # Internationalization, formatting dates/numbers
  path: ^1.9.0                       # File path utilities
  file_picker: ^8.1.0                # Pick files from device storage (PDF, audio, etc.)

  # UI & Charts
  cupertino_icons: ^1.0.8            # iOS-style icons
  fl_chart: ^1.1.1                   # Charting library for visualizations (e.g., waveforms)

  # Hardware, Permissions & Audio
  flutter_blue_plus: ^1.5.0          # Bluetooth Low Energy (BLE) support
  permission_handler: ^11.3.1        # Request/manage runtime permissions
  record: ^6.1.1                     # Record audio with raw data access
  just_audio: ^0.9.36                # Robust audio playback
  audio_waveforms: ^1.0.5            # Visualize audio waveforms in real time
  flutter_sound: ^9.2.13             # Advanced audio recording/playback, streams

  # AI & Reporting
  tflite_flutter: ^0.11.0            # Run TensorFlow Lite models on-device
  pdf: ^3.11.0                       # Generate PDF reports
  visibility_detector: ^0.4.0+2      # Detect widget visibility (e.g., lazy-loading charts)
  audio_session: ^0.1.25             # Manage audio focus and routing
  provider: ^6.1.5+1                 # State management
  fftea: ^1.5.0+1                    # FFT and audio analysis


dev_dependencies:
  flutter_test:
    sdk: flutter                     # Flutter testing framework
  flutter_lints: ^4.0.0              # Linting rules and static code analysis
  flutter_launcher_icons: ^0.14.3    # Automatically generate app launcher icons

flutter:
  uses-material-design: true
  assets:
    - assets/models/                 # Store AI/TFLite models
    - assets/images/                 # App images
    - assets/test_wavs/
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_icon.png"
